  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"60a5149a-5a6f-412d-bc14-413c2b573262\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"864ddf5d-21da-4659-95c9-f6dfdbee6e96\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"08878354-fc5e-4797-90fa-73a88c152667\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"60a5149a-5a6f-412d-bc14-413c2b573262\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"864ddf5d-21da-4659-95c9-f6dfdbee6e96\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"72bbea47-c633-4ef6-b03a-794f6856923a\"><\u002Fscript>\n<script src=\"5be3dbea-6eb7-4f70-aea8-3d2260658957\"><\u002Fscript>\n<style>\nhtml { scroll-behavior: smooth; }\nbody { margin: 0; background: var(--color-bg); color: var(--color-text); text-wrap: pretty; word-break: keep-all; }\na { color: inherit; text-decoration: none; }\na:hover { color: var(--color-accent-700); }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height: 100vh; font-family: var(--font-body);\">\n  <nav class=\"nav\" style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 16px clamp(20px, 5vw, 72px);\">\n    <span class=\"nav-brand\" style=\"margin-right: auto; letter-spacing: 0.04em;\">OBSESSED<\u002Fspan>\n    <a href=\"#pendants\" style=\"font-size: 15px;\">제품<\u002Fa>\n    <a href=\"#story\" style=\"font-size: 15px;\">스토리<\u002Fa>\n    <a href=\"#contact\" style=\"font-size: 15px;\">문의<\u002Fa>\n    <a href=\"#notice\" style=\"font-size: 15px;\">공지사항<\u002Fa>\n    <a href=\"#pendants\" style=\"font-size: 15px; font-weight: 600; font-feature-settings: 'tnum' 1;\">장바구니 {{ cartCount }}<\u002Fa>\n  <\u002Fnav>\n\n  <section style=\"background: {{ heroBg }}; color: {{ heroInk }};\">\n    <div style=\"max-width: 1320px; margin: 0 auto; padding: clamp(48px, 8vw, 96px) clamp(20px, 5vw, 72px) clamp(40px, 6vw, 72px);\">\n      <span style=\"display: block; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: {{ kickerInk }}; margin-bottom: 24px;\">Jewelry by Greta — Seoul<\u002Fspan>\n      <h1 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: {{ heroSize }}; line-height: 0.92; letter-spacing: -0.035em; margin: 0 0 0 -0.05em; white-space: nowrap;\">OBSESSED<\u002Fh1>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 32px clamp(24px, 5vw, 80px); margin-top: clamp(32px, 5vw, 56px); padding-top: 28px; border-top: 2px solid {{ heroRule }}; align-items: start;\">\n        <p style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(22px, 2.6vw, 32px); line-height: 1.3; margin: 0; max-width: 20ch;\">집착할 만큼 좋아하는 것들을, 몸에 걸 수 있게.<\u002Fp>\n        <div>\n          <p style=\"font-size: 17px; line-height: 1.7; margin: 0; max-width: 46ch;\">실버 925로, 디자이너 그레타의 사소하고 진지한 집착을 담은 주얼리.&nbsp; — 오늘 꽂힌 것이 내일의 펜던트가 됩니다.<\u002Fp>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px;\">\n            <a class=\"btn {{ heroBtnClass }}\" href=\"#pendants\" style=\"justify-content: flex-start;\">컬렉션 보기<\u002Fa>\n            <a class=\"btn btn-ghost\" href=\"#layered\" style=\"justify-content: flex-start; color: {{ heroInk }}; border-color: {{ heroInk }};\">레이어링 해보기<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"max-width: 1320px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 72px);\">\n    <section id=\"pendants\" style=\"padding: clamp(56px, 9vw, 104px) 0 clamp(48px, 8vw, 84px);\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 20px clamp(24px, 5vw, 80px); align-items: end; margin-bottom: 40px;\">\n        <div>\n          <span style=\"display: block; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 16px;\">Collection 01<\u002Fspan>\n          <h2 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(32px, 4.4vw, 56px); line-height: 1.05; letter-spacing: -0.02em; margin: 0;\">펜던트<\u002Fh2>\n          <p style=\"font-size: 15px; letter-spacing: 0.04em; margin: 10px 0 0; color: color-mix(in srgb, var(--color-text) 70%, transparent);\">Obsession Pendants<\u002Fp>\n        <\u002Fdiv>\n        <p style=\"font-size: 16px; line-height: 1.7; margin: 0; max-width: 48ch; color: color-mix(in srgb, var(--color-text) 80%, transparent);\">그레타가 요즘 꽂혀 있는 모티브들을 골라, 극도로 섬세하고 반짝이게 다시 재해석 했습니다. 작지만 가까이 볼수록 디테일이 많은 펜던트.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); column-gap: clamp(16px, 3vw, 32px); border-top: 2px solid var(--color-divider);\">\n        <sc-for list=\"{{ motifs }}\" as=\"m\" hint-placeholder-count=\"3\">\n          <article style=\"padding: 24px 0 8px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; border-bottom: 2px solid var(--color-divider);\">\n            <div style=\"aspect-ratio: 4 / 5; width: 100%; min-width: 0; position: relative; overflow: hidden;\">\n              <image-slot id=\"{{ m.slot }}\" shape=\"rect\" style=\"position: absolute; inset: 0; width: 100%; height: 100%;\" placeholder=\"{{ m.placeholder }}\"><\u002Fimage-slot>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 12px; align-items: baseline;\">\n              <span style=\"width: 10px; height: 10px; background: var(--color-accent); flex: none; align-self: center;\"><\u002Fspan>\n              <span style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 14px; font-feature-settings: 'tnum' 1;\">{{ m.num }}<\u002Fspan>\n              <h3 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 22px; line-height: 1.3; margin: 0;\">{{ m.title }}<\u002Fh3>\n            <\u002Fdiv>\n            <p style=\"font-size: 15px; line-height: 1.65; margin: 0; max-width: 40ch; color: color-mix(in srgb, var(--color-text) 78%, transparent);\">{{ m.desc }}<\u002Fp>\n            <div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-top: 16px; border-top: 2px solid var(--color-divider);\">\n              <span style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 20px; font-feature-settings: 'tnum' 1; color: {{ m.priceInk }};\">{{ m.priceLabel }}<\u002Fspan>\n              <sc-if value=\"{{ m.soldOut }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"tag tag-neutral\">품절<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 120px), 1fr)); gap: 8px; margin-bottom: 20px;\">\n              <sc-if value=\"{{ m.available }}\" hint-placeholder-val=\"{{ true }}\">\n                <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ m.onAdd }}\" style=\"justify-content: flex-start;\">{{ m.addLabel }}<\u002Fbutton>\n                <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ m.onBuy }}\" style=\"justify-content: flex-start;\">구매하기<\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ m.soldOut }}\" hint-placeholder-val=\"{{ false }}\">\n                <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ m.onNotify }}\" style=\"justify-content: flex-start; grid-column: 1 / -1;\">{{ m.notifyLabel }}<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <hr style=\"height: 2px; border: 0; margin: 0; background: var(--color-divider);\">\n\n    <section id=\"layered\" style=\"padding: clamp(56px, 9vw, 104px) 0 clamp(48px, 8vw, 84px);\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 20px clamp(24px, 5vw, 80px); align-items: end; margin-bottom: 40px;\">\n        <div>\n          <span style=\"display: block; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 16px;\">Collection 02<\u002Fspan>\n          <h2 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(32px, 4.4vw, 56px); line-height: 1.05; letter-spacing: -0.02em; margin: 0;\">레이어링 뱅글 &amp; 링<\u002Fh2>\n          <p style=\"font-size: 15px; letter-spacing: 0.04em; margin: 10px 0 0; color: color-mix(in srgb, var(--color-text) 70%, transparent);\">Impulse Layered Set<\u002Fp>\n        <\u002Fdiv>\n        <p style=\"font-size: 16px; line-height: 1.7; margin: 0; max-width: 48ch; color: color-mix(in srgb, var(--color-text) 80%, transparent);\">하나만 끼면 심심하니까. 그레타의 감각대로 {{ stackCount }}개를 과감하게 겹쳐 끼우는 스태킹 실버 링과 팔찌. 순서를 바꾸면 매일 다른 조합이 됩니다.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 2px; background: var(--color-divider); border: 2px solid var(--color-divider);\">\n        <sc-for list=\"{{ stack }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <div style=\"background: var(--color-bg); display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; min-width: 0;\">\n            <div style=\"aspect-ratio: 1 / 1; width: 100%; min-width: 0; position: relative; overflow: hidden;\">\n              <image-slot id=\"{{ s.slot }}\" shape=\"rect\" style=\"position: absolute; inset: 0; width: 100%; height: 100%;\" placeholder=\"{{ s.placeholder }}\"><\u002Fimage-slot>\n            <\u002Fdiv>\n            <div style=\"padding: 16px; display: grid; gap: 14px; align-content: start; border-top: 2px solid var(--color-divider);\">\n              <div style=\"display: flex; justify-content: space-between; gap: 12px; align-items: baseline;\">\n                <span style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 17px;\">{{ s.name }}<\u002Fspan>\n                <span style=\"font-size: 13px; letter-spacing: 0.08em; color: var(--color-accent-700); font-feature-settings: 'tnum' 1; white-space: nowrap;\">{{ s.layer }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;\">\n                <span style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 18px; font-feature-settings: 'tnum' 1; color: {{ s.priceInk }};\">{{ s.priceLabel }}<\u002Fspan>\n                <sc-if value=\"{{ s.soldOut }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"tag tag-neutral\">품절<\u002Fspan><\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 96px), 1fr)); gap: 8px;\">\n                <sc-if value=\"{{ s.available }}\" hint-placeholder-val=\"{{ true }}\">\n                  <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ s.onAdd }}\" style=\"justify-content: flex-start;\">{{ s.addLabel }}<\u002Fbutton>\n                  <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ s.onBuy }}\" style=\"justify-content: flex-start;\">구매하기<\u002Fbutton>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ s.soldOut }}\" hint-placeholder-val=\"{{ false }}\">\n                  <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ s.onNotify }}\" style=\"justify-content: flex-start; grid-column: 1 / -1;\">{{ s.notifyLabel }}<\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <hr style=\"height: 2px; border: 0; margin: 0; background: var(--color-divider);\">\n\n    <section id=\"story\" style=\"padding: clamp(56px, 9vw, 104px) 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 40px clamp(24px, 5vw, 80px); align-items: center;\">\n      <div style=\"aspect-ratio: 4 / 3; width: 100%; min-width: 0; position: relative; overflow: hidden;\">\n        <image-slot id=\"greta-studio\" shape=\"rect\" style=\"position: absolute; inset: 0; width: 100%; height: 100%;\" placeholder=\"그레타의 작업대 사진\"><\u002Fimage-slot>\n      <\u002Fdiv>\n      <figure style=\"margin: 0;\">\n        <span style=\"display: block; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 20px;\">Story<\u002Fspan>\n        <blockquote style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(24px, 2.8vw, 36px); line-height: 1.35; letter-spacing: -0.015em; margin: 0; max-width: 24ch;\">“저는 좋아하는 게 생기면 끝까지 파요. 그 집착이 제일 솔직한 디자인 이더라고요.”<\u002Fblockquote>\n        <figcaption style=\"font-size: 15px; margin-top: 24px; color: color-mix(in srgb, var(--color-text) 70%, transparent);\">— 그레타, OBSESSED 대표<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fsection>\n\n    <hr style=\"height: 2px; border: 0; margin: 0; background: var(--color-divider);\">\n\n    <section id=\"notice\" style=\"padding: clamp(56px, 9vw, 104px) 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 32px clamp(24px, 5vw, 80px); align-items: start;\">\n      <div>\n        <span style=\"display: block; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 16px;\">Notice<\u002Fspan>\n        <h2 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(32px, 4.4vw, 56px); line-height: 1.05; letter-spacing: -0.02em; margin: 0;\">공지사항<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"grid-column: 1 / -1; min-width: 0; border-top: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider);\">\n        <button sc-camel-on-click=\"{{ toggleNotice }}\" style=\"all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 22px 0;\">\n          <span class=\"tag tag-accent\">안내<\u002Fspan>\n          <span style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(18px, 2vw, 22px); line-height: 1.35;\">배송·교환·반품 안내<\u002Fspan>\n          <span style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 24px; line-height: 1; color: var(--color-accent-700);\">{{ noticeIcon }}<\u002Fspan>\n        <\u002Fbutton>\n        <sc-if value=\"{{ noticeOpen }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 2px; background: var(--color-divider); border-top: 2px solid var(--color-divider);\">\n            <div style=\"background: var(--color-bg); padding: 20px 20px 24px 0; display: grid; gap: 10px; align-content: start;\">\n              <span style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 17px;\">배송<\u002Fspan>\n              <p style=\"font-size: 15px; line-height: 1.7; margin: 0;\">결제 후 2–5영업일 이내 출고됩니다. 주문 제작 상품은 7–14영업일이 걸립니다. 배송비 3,000원, 50,000원 이상 구매 시 무료.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background: var(--color-bg); padding: 20px 20px 24px; display: grid; gap: 10px; align-content: start;\">\n              <span style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 17px;\">교환·반품<\u002Fspan>\n              <p style=\"font-size: 15px; line-height: 1.7; margin: 0;\">상품 수령 후 7일 이내 신청할 수 있습니다. 단순 변심은 왕복 배송비 6,000원이 부과되며, 불량·오배송은 무료입니다.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background: var(--color-bg); padding: 20px 20px 24px; display: grid; gap: 10px; align-content: start;\">\n              <span style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 17px;\">불가 사항<\u002Fspan>\n              <p style=\"font-size: 15px; line-height: 1.7; margin: 0;\">착용 흔적이 있거나 포장이 훼손된 경우, 각인·사이즈 맞춤 등 주문 제작 상품은 교환·반품이 어렵습니다.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n\n  <section id=\"contact\" style=\"background: {{ closeBg }}; color: {{ closeInk }};\">\n    <div style=\"max-width: 1320px; margin: 0 auto; padding: clamp(56px, 9vw, 96px) clamp(20px, 5vw, 72px); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 40px clamp(24px, 5vw, 80px); align-items: end;\">\n      <h3 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(36px, 5vw, 60px); line-height: 1.1; letter-spacing: -0.015em; margin: 0;\">당신의 다음 집착은 무엇인가요?<\u002Fh3>\n      <div style=\"display: grid; border-top: 2px solid {{ closeInk }};\">\n        <a href=\"https://instagram.com/\" style=\"display: flex; justify-content: space-between; gap: 16px; padding: 18px 0; border-bottom: 2px solid {{ closeInk }}; color: {{ closeInk }}; font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(18px, 2vw, 22px);\" target=\"_blank\" rel=\"noopener noreferrer\"><span>Instagram<\u002Fspan><span style=\"text-align: right;\">@obsessed.jewelry ↗<\u002Fspan><\u002Fa>\n        <a href=\"mailto:hello@obsessed.kr\" style=\"display: flex; justify-content: space-between; gap: 16px; padding: 18px 0; border-bottom: 2px solid {{ closeInk }}; color: {{ closeInk }}; font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(18px, 2vw, 22px);\" target=\"_blank\" rel=\"noopener noreferrer\"><span>주문 · 협업<\u002Fspan><span style=\"overflow-wrap: anywhere; text-align: right;\">hello@obsessed.kr<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"max-width: 1320px; margin: 0 auto; padding: 28px clamp(20px, 5vw, 72px); font-size: 13px; color: color-mix(in srgb, var(--color-text) 70%, transparent);\">© 2026 OBSESSED<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;mood&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Gallery&quot;,&quot;Obsessed&quot;],&quot;default&quot;:&quot;Gallery&quot;,&quot;tsType&quot;:&quot;'Gallery' | 'Obsessed'&quot;,&quot;section&quot;:&quot;Feel&quot;},&quot;voice&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Shout&quot;,&quot;Whisper&quot;],&quot;default&quot;:&quot;Shout&quot;,&quot;tsType&quot;:&quot;'Shout' | 'Whisper'&quot;,&quot;section&quot;:&quot;Feel&quot;},&quot;stackCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;min&quot;:3,&quot;max&quot;:4,&quot;step&quot;:1,&quot;default&quot;:4,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Layered Set&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const mood = this.props.mood ?? 'Gallery';\n    const voice = this.props.voice ?? 'Shout';\n    const n = Math.max(3, Math.min(4, this.props.stackCount ?? 4));\n    const red = mood === 'Obsessed';\n    const ink = 'var(--color-text)', paper = 'var(--color-bg)', accent = 'var(--color-accent)';\n    const pieces = [\n      { name: '스파클 체인 링', placeholder: '링 1', price: 48000 },\n      { name: '볼드 실버 뱅글', placeholder: '뱅글', price: 72000 },\n      { name: '트위스트 링', placeholder: '링 2', price: 39000, soldOut: true },\n      { name: '미니 참 브레이슬릿', placeholder: '브레이슬릿', price: 45000 }\n    ];\n    const cart = this.state.cart || {}, notify = this.state.notify || {};\n    const shop = (id, item) => {\n      const so = !!item.soldOut;\n      return { ...item, soldOut: so, available: !so,\n        priceLabel: '₩' + item.price.toLocaleString('ko-KR'),\n        priceInk: so ? 'color-mix(in srgb, var(--color-text) 55%, transparent)' : 'var(--color-text)',\n        addLabel: cart[id] ? '담김 · ' + cart[id] : '장바구니',\n        notifyLabel: notify[id] ? '재입고 알림 신청됨' : '재입고 알림 받기',\n        onAdd: () => this.setState(s => ({ cart: { ...(s.cart || {}), [id]: ((s.cart || {})[id] || 0) + 1 } })),\n        onBuy: () => this.setState(s => ({ cart: { ...(s.cart || {}), [id]: Math.max(1, (s.cart || {})[id] || 0) } })),\n        onNotify: () => this.setState(s => ({ notify: { ...(s.notify || {}), [id]: !(s.notify || {})[id] } })) };\n    };\n    const cartCount = Object.values(cart).reduce((a, b) => a + b, 0);\n    return {\n      heroBg: red ? accent : paper,\n      heroInk: red ? paper : ink,\n      heroRule: red ? paper : 'var(--color-divider)',\n      kickerInk: red ? paper : 'var(--color-accent-700)',\n      heroBtnClass: red ? 'btn-secondary' : 'btn-primary',\n      closeBg: red ? ink : accent,\n      closeInk: paper,\n      heroSize: voice === 'Shout' ? 'clamp(48px, 12.5vw, 196px)' : 'clamp(44px, 7vw, 96px)',\n      stackCount: n,\n      cartCount,\n      noticeOpen: this.state.noticeOpen ?? true,\n      noticeIcon: (this.state.noticeOpen ?? true) ? '−' : '+',\n      toggleNotice: () => this.setState(s => ({ noticeOpen: !(s.noticeOpen ?? true) })),\n      motifs: [\n        { price: 89000, num: '01', slot: 'pendant-dessert', placeholder: '디저트 펜던트', title: '디저트', desc: '마카롱, 체리 타르트, 슈가 코팅까지. 먹고 싶을 만큼 반짝이는 미니어처.' },\n        { price: 124000, num: '02', slot: 'pendant-button', placeholder: '앤틱 단추 펜던트', title: '앤틱 단추', desc: '벼룩시장에서 찾은 오래된 단추의 패턴을 실버 위에 그대로 옮겼습니다.' },\n        { price: 156000, soldOut: true, num: '03', slot: 'pendant-locket', placeholder: '빈티지 로켓 펜던트', title: '빈티지 로켓', desc: '열면 작은 사진 한 장. 비밀 하나쯤 넣고 다니는 로켓 목걸이.' }\n      ].map(m => shop(m.slot, m)),\n      stack: pieces.slice(0, n).map((p, i) => shop('stack-' + (i + 1), { ...p, slot: 'stack-' + (i + 1), layer: 'LAYER ' + String(i + 1).padStart(2, '0') }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
