<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>베네치아 스트라이프 — 15초 홍보 영상 | OBSESSED</title>
<meta name="description" content="OBSESSED 베네치아 스트라이프 펜던트 15초 홍보 영상.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
  :root {
    --ink: #f3f2f2;
    --accent: #ec3013;
    --font: "Archivo", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { font-family: var(--font); color: var(--ink); word-break: keep-all; -webkit-font-smoothing: antialiased; }
  body.hide-cursor, body.hide-cursor * { cursor: none !important; }

  /* 화면 전체를 쓰는 무대. 휴대폰·태블릿·PC 어떤 비율이든 영상이 꽉 찹니다. */
  .stage {
    position: fixed; inset: 0; overflow: hidden; background: #000;
    container-type: size;
    /* 글자 크기 기준: 가로 화면(PC·태블릿 가로) */
    --u: min(1cqw, 1.778cqh);
  }
  @media (orientation: portrait) {
    /* 세로 화면(휴대폰·태블릿 세로)에서는 글자를 조금 더 크게 */
    .stage { --u: min(1.6cqw, 1cqh); }
  }
  .video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%; background: #000; }

  /* 글자를 읽기 쉽게 아래쪽을 살짝 어둡게 */
  .scrim { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to top, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0.25) 38%, rgba(0,0,0,0) 62%); }
  .endshade { position: absolute; inset: 0; background: #121110; opacity: 0; pointer-events: none; }

  .cap {
    position: absolute; left: calc(6 * var(--u)); right: calc(6 * var(--u)); bottom: calc(9 * var(--u));
    opacity: 0; will-change: transform, opacity; transform-origin: left bottom;
    text-shadow: 0 0.2em 1.2em rgba(0,0,0,0.35);
  }
  @media (orientation: portrait) {
    .cap { bottom: calc(14 * var(--u) + env(safe-area-inset-bottom)); }
  }
  .eyebrow { display: block; font-weight: 800; font-size: max(12px, calc(1.5 * var(--u))); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink); margin-bottom: calc(1.6 * var(--u)); }
  .eyebrow b { color: var(--accent); font-weight: 900; }
  .big { font-weight: 900; line-height: 1.02; letter-spacing: -0.03em; }
  .title .big { font-size: calc(8 * var(--u)); }
  .feat .big { font-size: calc(6.2 * var(--u)); }
  .num { display: flex; align-items: center; gap: calc(1 * var(--u)); font-weight: 900; font-size: max(13px, calc(1.8 * var(--u))); color: var(--ink); margin-bottom: calc(1.4 * var(--u)); font-feature-settings: 'tnum' 1; }
  .num::before { content: ""; width: calc(1.1 * var(--u)); height: calc(1.1 * var(--u)); min-width: 9px; min-height: 9px; background: var(--accent); }
  .price { font-family: "Archivo", var(--font); font-weight: 900; font-size: calc(11 * var(--u)); line-height: 1; letter-spacing: -0.04em; color: var(--ink); font-feature-settings: 'tnum' 1; }
  .price-bar { height: max(4px, calc(0.45 * var(--u))); background: var(--accent); margin-top: calc(1.4 * var(--u)); transform-origin: left; transform: scaleX(0); }

  .end { bottom: auto; top: 50%; translate: 0 -50%; }
  .end .big { font-size: calc(9.5 * var(--u)); margin: calc(1.2 * var(--u)) 0 calc(2.6 * var(--u)); }
  .end .url { display: inline-block; font-weight: 800; font-size: max(15px, calc(2.8 * var(--u))); padding-bottom: calc(0.6 * var(--u)); border-bottom: max(3px, calc(0.4 * var(--u))) solid var(--accent); }
  .brand { position: absolute; top: calc(6 * var(--u)); right: calc(6 * var(--u)); font-weight: 900; font-size: max(14px, calc(2.2 * var(--u))); letter-spacing: 0.06em; opacity: 0; }

  /* 화면 위 버튼들 */
  .ui { position: absolute; z-index: 5; font-family: var(--font); color: var(--ink); }
  .back { top: max(14px, calc(2.4 * var(--u))); left: max(14px, calc(2.4 * var(--u))); font-weight: 700; font-size: max(13px, calc(1.3 * var(--u))); text-decoration: none; opacity: 0.55; transition: opacity 0.3s; padding: 6px 2px; }
  .replay {
    right: max(14px, calc(2.4 * var(--u))); bottom: calc(max(14px, calc(2.6 * var(--u))) + env(safe-area-inset-bottom));
    font-weight: 800; font-size: max(13px, calc(1.4 * var(--u)));
    background: rgba(0,0,0,0.15); border: 2px solid var(--ink); padding: max(8px, calc(0.8 * var(--u))) max(14px, calc(1.4 * var(--u)));
    cursor: pointer; opacity: 0.4; transition: opacity 0.3s, background 0.2s;
  }
  .back:hover, .back:focus-visible, .replay:hover, .replay:focus-visible, .stage.ended .replay, .stage.ended .back { opacity: 1; }
  .replay:hover { background: rgba(243,242,242,0.12); }
  .play-big {
    left: 50%; top: 50%; translate: -50% -50%; display: none;
    font-weight: 900; font-size: max(16px, calc(2 * var(--u))); background: var(--accent); border: 0; padding: 14px 26px; cursor: pointer;
  }
  .stage.blocked .play-big { display: block; }
  .progress { position: absolute; left: 0; bottom: 0; height: max(3px, calc(0.4 * var(--u))); width: 0; background: var(--accent); z-index: 4; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  /* 제출용 mp4를 만들 때 쓰는 모드(글자만 투명 배경으로 그림) */
  body.render, body.render .stage { background: transparent; }
  body.render .video, body.render .ui, body.render .progress { display: none !important; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <video class="video" id="video" src="assets/promo-venezia.mp4" poster="assets/promo-poster.jpg"
         muted playsinline autoplay preload="auto" aria-label="베네치아 스트라이프를 착용하고 유럽 거리를 걷는 모델 영상"></video>
  <div class="scrim" id="scrim"></div>
  <div class="endshade" id="endshade"></div>

  <!-- 0초~: 상품 이름 -->
  <div class="cap title" data-start="0" data-end="1.867" data-fx="slam">
    <span class="eyebrow"><b>OBSESSED</b> — 시간과 빛을 담은 펜던트</span>
    <p class="big">베네치아<br>스트라이프</p>
  </div>
  <!-- 특징 1 -->
  <div class="cap feat" data-start="1.867" data-end="3.733" data-fx="zoom">
    <span class="num">01</span>
    <p class="big">실버 925</p>
  </div>
  <!-- 특징 2 -->
  <div class="cap feat" data-start="3.733" data-end="6.1" data-fx="slide">
    <span class="num">02</span>
    <p class="big">무라노의<br>수제 유리</p>
  </div>
  <!-- 특징 3 -->
  <div class="cap feat" data-start="6.1" data-end="8.75" data-fx="shake">
    <span class="num">03</span>
    <p class="big">같은 패턴은<br>하나도 없습니다</p>
  </div>
  <!-- 가격 -->
  <div class="cap pricecap" data-start="8.75" data-end="11.4" data-fx="up">
    <span class="eyebrow">베네치아 스트라이프 · <b>가격</b></span>
    <p class="price" id="price">₩0</p>
    <div class="price-bar" id="pricebar"></div>
  </div>
  <!-- 마지막 -->
  <div class="cap end" data-start="11.4" data-end="999" data-fx="slam">
    <span class="eyebrow"><b>OBSESSED</b> — 베네치아 스트라이프</span>
    <p class="big">지금<br>만나보세요</p>
    <span class="url" id="url">lehju05-ux.github.io/hyun1205</span>
  </div>
  <span class="brand" id="brand">OBSESSED</span>

  <a class="ui back" href="index.html">← 판매 사이트로</a>
  <button class="ui replay" id="replay" type="button">↻ 다시보기</button>
  <button class="ui play-big" id="playbig" type="button">▶ 영상 재생</button>
  <div class="progress" id="progress"></div>
</div>

<script>
(function () {
  var DURATION = 15, PRICE = 124000, END_START = 11.4;
  var stage = document.getElementById('stage');
  var video = document.getElementById('video');
  var caps = Array.prototype.slice.call(document.querySelectorAll('.cap'));
  var priceEl = document.getElementById('price');
  var priceBar = document.getElementById('pricebar');
  var endshade = document.getElementById('endshade');
  var scrim = document.getElementById('scrim');
  var brand = document.getElementById('brand');
  var url = document.getElementById('url');
  var progress = document.getElementById('progress');

  function clamp(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function easeBack(x) { var c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function won(n) { return '₩' + Math.round(n).toLocaleString('ko-KR'); }

  // 시간 t(초)에 맞춰 글자의 위치와 투명도를 정합니다.
  // 웹페이지에서는 영상 재생 시간, mp4를 만들 때는 프레임 시간이 들어옵니다.
  function renderAt(t) {
    caps.forEach(function (el) {
      var s = +el.dataset.start, e = +el.dataset.end, fx = el.dataset.fx;
      var lt = t - s, d = e - s;
      if (lt < 0 || lt > d) { el.style.opacity = 0; return; }
      var pin = clamp(lt / 0.42), pout = clamp((d - lt) / 0.22);
      var op = Math.min(1, easeOut(pin) * 1.25) * pout;
      var tf = '';
      if (fx === 'slam') tf = 'scale(' + (1.45 - 0.45 * easeOut(pin)) + ')';
      if (fx === 'zoom') tf = 'scale(' + (0.55 + 0.45 * easeBack(pin)) + ')';
      if (fx === 'slide') tf = 'translateX(' + ((1 - easeOut(pin)) * 22) + '%)';
      if (fx === 'up') tf = 'translateY(' + ((1 - easeOut(pin)) * 30) + '%)';
      if (fx === 'shake') {
        var k = lt - 0.3, amp = k > 0 && k < 0.6 ? (1 - k / 0.6) : 0;
        tf = 'scale(' + (1.2 - 0.2 * easeOut(pin)) + ') translateX(' + (Math.sin(k * 55) * 1.4 * amp) + '%)';
      }
      el.style.opacity = op;
      el.style.transform = tf;
    });

    // 가격: 0원부터 올라갑니다
    var pc = clamp((t - 8.95) / 1.5);
    priceEl.textContent = won(PRICE * easeOut(pc));
    priceBar.style.transform = 'scaleX(' + easeOut(clamp((t - 8.95) / 2.2)) + ')';

    // 마지막 장면: 화면이 어두워지고 주소가 나타납니다
    var ep = clamp((t - END_START) / 0.5);
    endshade.style.opacity = 0.82 * ep;
    scrim.style.opacity = 1 - ep;
    url.style.opacity = clamp((t - END_START - 0.6) / 0.5);
    brand.style.opacity = clamp((t - END_START - 0.9) / 0.6);

    progress.style.width = (clamp(t / DURATION) * 100) + '%';
  }
  window.renderAt = renderAt;

  // 제출용 mp4를 만들 때: promo.html?render=1
  if (/[?&]render=1/.test(location.search)) {
    document.body.classList.add('render');
    document.documentElement.style.background = 'transparent';
    video.removeAttribute('autoplay'); video.removeAttribute('src'); video.load();
    renderAt(0);
    return;
  }

  var raf = 0;
  function loop() {
    renderAt(video.currentTime);
    if (!video.paused && !video.ended) raf = requestAnimationFrame(loop);
  }
  video.addEventListener('play', function () {
    stage.classList.remove('ended', 'blocked');
    document.body.classList.add('hide-cursor');
    cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
  });
  video.addEventListener('ended', function () {
    renderAt(DURATION);
    stage.classList.add('ended');
    document.body.classList.remove('hide-cursor');
  });
  video.addEventListener('seeked', function () { renderAt(video.currentTime); });

  function play() {
    video.currentTime = 0;
    var p = video.play();
    if (p && p.catch) p.catch(function () { stage.classList.add('blocked'); });
  }
  document.getElementById('replay').addEventListener('click', play);
  document.getElementById('playbig').addEventListener('click', play);
  document.addEventListener('keydown', function (e) { if (e.key === 'r' || e.key === 'R') play(); });

  // 마우스를 움직이면 잠깐 커서가 보입니다 (녹화할 때는 숨김)
  var hideTimer = 0;
  document.addEventListener('mousemove', function () {
    document.body.classList.remove('hide-cursor');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () { if (!video.paused) document.body.classList.add('hide-cursor'); }, 1200);
  });

  renderAt(0);
  // 자동 재생이 막힌 기기(절전 모드 등)에서는 재생 버튼을 보여 줍니다
  var p = video.play();
  if (p && p.catch) p.catch(function () { stage.classList.add('blocked'); });
})();
</script>
</body>
</html>
